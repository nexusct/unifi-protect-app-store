name: nexus-vision-ai

x-vision-environment: &vision-environment
  VISION_CONFIG: /config/sites.yaml
  VISION_RUNTIME_SETTINGS: /config/runtime-settings.json
  VISION_DATA: /data
  VISION_MODELS: /models
  VISION_EVIDENCE: /evidence
  VISION_LICENSE_DIR: /config/licensing
  VISION_ENTITLEMENT_TRUST_STORE: /config/trusted-entitlement-keys.json
  VISION_SETUP_RESTART_ENABLED: "true"
  PUID: "${PUID:-1000}"
  PGID: "${PGID:-1000}"

x-vision-base: &vision-base
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: *vision-environment
  volumes:
    - ./config:/config
    - ./data:/data
    - ./models:/models
    - ./evidence:/evidence
  # Administrative/setup routes remain loopback-only by default. Put an
  # authenticated reverse proxy in front before allowing access beyond the host.
  ports:
    - "127.0.0.1:8090:8090"
  # Liveness stays green during first-run setup. Operational readiness is /ready.
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8090/health', timeout=3).read()"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 90s

services:
  # Production: NVIDIA GPU (requires nvidia-container-toolkit on the host)
  vision-gpu:
    <<: *vision-base
    platform: linux/amd64
    container_name: nexus-vision-ai
    profiles: ["gpu"]
    environment:
      <<: *vision-environment
      VISION_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # CPU mode: onboarding, event-only analytics, image health, and evaluation.
  vision-cpu:
    <<: *vision-base
    platform: linux/amd64
    container_name: nexus-vision-ai-cpu
    profiles: ["cpu"]
    environment:
      <<: *vision-environment
      VISION_DEVICE: cpu
